<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F5FB">
<title>Vidz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column (max 480px) with three tabs (Home, My List, Me)
   and two full-screen layers on top (drama detail, vertical episode player). */
:root{
  --bg:#F6F5FB; --surface:#FFFFFF; --fg:#15142A; --muted:#66658A; --line:#E1DFF0;
  --accent:#4B5BFF; --accent-fg:#FFFFFF; --mark:#E59A00; --bar:#FFFFFFEE;
  --display:'Bricolage Grotesque','Hind Siliguri',system-ui,sans-serif;
  --body:'DM Sans','Hind Siliguri',system-ui,sans-serif;
  --w:480px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F1C; --surface:#181A2E; --fg:#F1F0FA; --muted:#9C9BB8; --line:#2A2C45;
    --accent:#7C8BFF; --accent-fg:#0E0F1C; --mark:#FFC53D; --bar:#0E0F1CEE; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F1C; --surface:#181A2E; --fg:#F1F0FA; --muted:#9C9BB8; --line:#2A2C45;
  --accent:#7C8BFF; --accent-fg:#0E0F1C; --mark:#FFC53D; --bar:#0E0F1CEE; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.45;
  padding-block:0; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:var(--w);margin:0 auto;padding-bottom:96px;min-height:100vh}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
svg{display:block}

/* header + search */
.top{display:flex;align-items:center;gap:12px;padding-top:14px}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.logo i svg{width:12px;height:12px;fill:var(--accent-fg);margin-left:2px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}

/* posters (generated artwork, no external images) */
.poster{--a:260;--b:300;position:relative;overflow:hidden;aspect-ratio:2/3;border-radius:12px;isolation:isolate;
  background:radial-gradient(120% 80% at 85% 8%,hsl(var(--a) 85% 62% / .55),transparent 60%),linear-gradient(165deg,hsl(var(--a) 62% 34%),hsl(var(--b) 58% 12%))}
.poster::after{content:"";position:absolute;width:72%;aspect-ratio:1;right:-22%;top:10%;border-radius:50%;border:2px solid hsl(var(--a) 90% 85% / .25);z-index:-1}
.poster .pt{position:absolute;left:10px;right:10px;bottom:10px;font-family:var(--display);font-weight:800;font-size:17px;line-height:1;letter-spacing:-.02em;color:#fff;text-transform:uppercase;text-wrap:balance;text-shadow:0 2px 10px #0006}
.poster .pg{position:absolute;left:8px;top:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#0005;padding:3px 7px;border-radius:6px;backdrop-filter:blur(4px)}
.poster .pn{position:absolute;right:0;top:10px;font-size:10px;font-weight:800;letter-spacing:.06em;color:#1b1300;background:var(--mark);padding:3px 8px 3px 10px;border-radius:6px 0 0 6px}
.save{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:#0006;display:grid;place-items:center;z-index:2;backdrop-filter:blur(4px)}
.save svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.save[aria-pressed="true"] svg{fill:#fff}
.card{display:block;text-align:left;min-width:0}
.card .poster{width:100%}
.card .ct{margin-top:7px;font-weight:700;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cv{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;margin-top:2px}
.card .cv svg{width:9px;height:9px;fill:currentColor}
.card .cwrap{position:relative}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec h2{font-size:21px;letter-spacing:-.02em}
.sec span{color:var(--muted);font-size:12px}

/* hero carousel */
.hero{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 0 4px;scrollbar-width:none}
.hero::-webkit-scrollbar{display:none}
.hcard{flex:0 0 80%;scroll-snap-align:center;position:relative;text-align:left;border-radius:18px;overflow:hidden}
.hcard .poster{aspect-ratio:4/5;border-radius:18px}
.hcard .pt{display:none}
.hov{position:absolute;inset:auto 0 0 0;padding:44px 16px 16px;background:linear-gradient(transparent,#000a);color:#fff;display:flex;flex-direction:column;gap:6px}
.hov h3{font-size:26px;line-height:1;letter-spacing:-.03em;text-transform:uppercase}
.hov p{margin:0;font-size:12px;opacity:.85}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#14132a;font-weight:700;border-radius:999px;padding:8px 16px;margin-top:4px}
.pill svg{width:11px;height:11px;fill:currentColor}

/* top 10 */
.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.t10{flex:none;display:flex;align-items:flex-end;gap:0;text-align:left}
.t10 b{font-family:var(--display);font-weight:800;font-size:84px;line-height:.8;letter-spacing:-.08em;color:transparent;-webkit-text-stroke:2px var(--accent);margin-right:-10px;position:relative;z-index:1;padding-bottom:4px}
.t10 .poster{width:104px}

/* segmented + lists */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.page-h{font-size:30px;letter-spacing:-.03em;padding-top:18px;margin-bottom:14px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:18px;margin-bottom:4px}

/* me */
.profile{display:flex;align-items:center;gap:14px;padding-top:18px}
.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(140deg,var(--accent),hsl(320 70% 60%));display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#fff;flex:none}
.profile .who{flex:1;min-width:0}
.profile .who b{display:block;font-family:var(--display);font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile .who small{color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-fg);font-weight:700;border-radius:999px;padding:10px 20px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.menu{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.row span{flex:1;min-width:0}
.row em{font-style:normal;color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:12px;margin-top:14px}

/* notifications */
.bell{position:relative;width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.bell svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.bell i{position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:50%;background:#e5484d;border:2px solid var(--surface)}
.nrow{display:flex;gap:12px;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line)}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.ntx{display:flex;flex-direction:column;gap:2px;min-width:0}
.ntx small{color:var(--muted)}
.nrow{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.nrow.anim{transition:transform .22s ease,opacity .22s ease}
@media (prefers-reduced-motion: reduce){.nrow.anim{transition:none}}
/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--w));z-index:20;display:flex;background:var(--bar);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 0}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar button[aria-current="page"] svg{fill:currentColor;fill-opacity:.18}

/* overlays */
.ov{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--w));z-index:30;background:var(--bg);overflow-y:auto;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin-top:12px}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.d-hero{display:flex;gap:16px;margin-top:14px;align-items:flex-end}
.d-hero .poster{width:42%;flex:none}
.d-hero h1{font-size:30px;line-height:1;letter-spacing:-.03em}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:13px;margin-top:8px}
.syn{margin:18px 0}
.acts{display:flex;gap:10px}
.acts .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.acts .btn svg{width:13px;height:13px;fill:currentColor}
.eps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.eps button{height:46px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:700}
.eps button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* player (always dark) */
#player{background:#07070d;color:#fff;padding:0;overflow:hidden}
.stage{position:absolute;inset:0;--a:260;--b:300;background:linear-gradient(160deg,hsl(var(--a) 60% 26%),hsl(var(--b) 55% 9%),hsl(var(--a) 50% 18%));background-size:220% 220%;animation:drift 9s ease-in-out infinite alternate;touch-action:pan-x}
.stage.paused{animation-play-state:paused}
@keyframes drift{from{background-position:0% 0%}to{background-position:100% 100%}}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.ghost-ep{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--display);font-weight:800;font-size:96px;letter-spacing:-.05em;color:#fff;opacity:.13;pointer-events:none}
.ph{position:absolute;left:0;right:0;top:calc(34% + 108px);text-align:center;font-size:12px;opacity:.6;padding:0 40px}
.p-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;z-index:3;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));background:linear-gradient(#000a,transparent)}
.p-top .back{flex:none;margin:0;width:36px;height:36px;background:none;border:0;border-radius:0;color:#fff;filter:drop-shadow(0 1px 4px #0009)}
.p-top .back svg{width:26px;height:26px;stroke-width:2.4}
.p-top b{font-family:var(--display);font-size:18px;font-weight:700;text-shadow:0 1px 6px #0009}
.pth{flex:none;width:40px;height:54px;border-radius:9px;overflow:hidden;background:linear-gradient(160deg,hsl(var(--a) 60% 30%),hsl(var(--b) 55% 12%));box-shadow:0 0 0 1px #fff3,0 4px 12px #0007}
.pth img{display:block;width:100%;height:100%;object-fit:cover}
.p-top b{min-width:0;line-height:1.25}
.p-top,.p-side,.p-bot{transition:opacity .45s ease}
#player.ui-off .p-top,#player.ui-off .p-side,#player.ui-off .p-bot{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.p-top,.p-side,.p-bot{transition:none}}
.adbox{display:flex;justify-content:center;align-items:center;overflow:hidden}
.adf{border:0;width:320px;max-width:100%;height:50px;display:block;background:transparent}
body.vz-nosocial .vzx{display:none!important}
#adHome{display:flex;justify-content:center;height:0;overflow:hidden;position:fixed;left:50%;transform:translateX(-50%);width:min(100%,var(--w));bottom:var(--tbh,64px);z-index:19}
#adHome.ok{height:auto;overflow:visible}
body.hasad #app{padding-bottom:160px}
.p-ad{position:absolute;left:0;right:0;z-index:4;display:flex;justify-content:center;height:0;overflow:hidden;visibility:hidden}
#player.ui-off .p-ad.on{visibility:visible}
#player.ui-off .p-ad.on.ok{height:auto;overflow:visible}
.p-adt{top:calc(6px + env(safe-area-inset-top,0px))}
.p-adb{bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.p-side{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;gap:22px;align-items:center}
.p-side span{display:none}
.p-side button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;text-shadow:0 1px 6px #000a}
.p-side svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2;filter:drop-shadow(0 1px 5px #0008)}
.p-side button[aria-pressed="true"] svg{fill:#fff}
.p-bot{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:40px 0 0;background:linear-gradient(transparent,#000a 55%,#000b)}
.p-bot>*:not(.p-ctl){margin-left:max(14px,env(safe-area-inset-left,0px));margin-right:max(14px,env(safe-area-inset-right,0px))}
.pbrow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.pbrow .pth{width:36px;height:48px;border-radius:6px}
.pbt{min-width:0;flex:1}
.pbt p{margin:0}
.p-bot h2{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0;padding-right:56px;text-shadow:0 1px 6px #0009}
.p-bot p{margin:0 0 10px;font-size:13px;opacity:.75}
.p-bot p.pstory{opacity:.95;font-size:13px;line-height:1.4;margin-bottom:10px;padding-right:56px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-bot p.pstory[hidden]{display:none}
.epbtn{display:flex;align-items:center;gap:10px;width:calc(100% - 28px - 56px);background:#4a4a4ab3;border:0;border-radius:8px;padding:10px 12px;font-weight:700;backdrop-filter:blur(6px)}
.epbtn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.epbtn span{flex:1;text-align:left}
.bar{margin-top:8px;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.bar i{display:block;width:100%;height:3px;border-radius:3px;background:#fff3;position:relative}
.bar i u{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:3px;width:0}
.p-ctl{display:flex;justify-content:flex-end;align-items:center;gap:22px;font-size:15px;font-weight:700;background:#000;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) 16px}
.p-ctl button,.p-ctl .hdq{display:flex;align-items:center;gap:8px;padding:0;background:none;color:#fff;font:inherit}
.p-ctl svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8}
.playflash{position:absolute;left:50%;top:44%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:#0007;display:grid;place-items:center;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s}
.playflash.on{opacity:1}
.playflash svg{width:30px;height:30px;fill:#fff;margin-left:4px}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,var(--w));max-height:72vh;overflow-y:auto;background:#1a1c2e;color:#fff;border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet.light{background:var(--surface);color:var(--fg)}
.sheet h3{font-size:19px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px}
.sheet .eps button{background:#ffffff14;border-color:#ffffff1f;color:#fff}
.sheet .eps button[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}
.ranges{display:flex;gap:16px;margin-bottom:14px}
.ranges button{font-weight:700;color:var(--muted);padding-bottom:4px;border-bottom:2px solid transparent}
.ranges button[aria-current="true"]{color:var(--fg);border-color:var(--accent)}
.sheet .ranges button{color:#ffffffb3}
.sheet .ranges button[aria-current="true"]{color:#fff;border-color:var(--accent)}
textarea.field{font:inherit;color:inherit}
.field{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;margin:6px 0 12px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:#14132a;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;max-width:88%;text-align:center;box-shadow:0 6px 24px #0006}
.hist-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 0}
.hist-item .poster{width:46px;flex:none;border-radius:8px}
.hist-item .poster .pt,.hist-item .poster .pg,.hist-item .poster .pn{display:none}
.hist-item b{display:block}
.hist-item small{color:var(--muted)}
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.poster.hasimg::after,.poster.hasimg .pt{display:none}
.eps button.lk{position:relative;color:var(--muted)}
.eps button.lk svg{position:absolute;top:4px;right:4px;width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2}
.eps button.lk[aria-current="true"]{color:var(--accent-fg)}
.sheet .eps button.lk{color:#ffffffa6}
.prem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#f5b53d,#e8791f);color:#2a1600}
.prem>svg:first-child{flex:none;width:30px;height:30px;fill:#2a1600;stroke:none}
.prem span{flex:1;min-width:0}.prem b{display:block;font-size:16px}.prem small{display:block;font-size:12.5px;opacity:.85;margin-top:1px}
.prem>svg:last-child{flex:none;width:18px;height:18px;stroke:#2a1600;fill:none;stroke-width:2}
.psec{margin-top:18px}
.psh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.psh svg{flex:none;width:28px;height:28px;fill:#e8931f;stroke:none}
.psh b{display:block;font-size:17px}.psh small{display:block;color:var(--muted);font-size:12.5px}

  $("stTitle").textContent=T(TX[0]);$("stSub").textContent=T(TX[1]);$("finish").textContent=T(TX[2]);$("stFine").textContent=T(TX[3]);
  var steps=[["Payment submitted","done"],["Admin verification",st==="pending"?"cur":st==="approved"?"done":"bad"],["Premium activated",st==="approved"?"done":"todo"]];
  if(st==="rejected")steps[1][0]="Verification failed";
  $("track").innerHTML=steps.map(function(x){return '<li class="'+x[1]+'"><i>'+(x[1]==="done"?CHK:x[1]==="bad"?XX:"")+'</i>'+T(x[0])+'</li>'}).join("");
  if(lastItem){lastItem.status=st;saveHist();renderHistory()}
  if(st==="approved"&&typeof window.onPremiumActivated==="function")window.onPremiumActivated(lastData);
}
function findItem(ref){
  if(ref&&typeof ref==="object")ref=ref.id||ref.transactionId;
  return PAYS.filter(function(h){return ref&&(h.id===ref||h.transactionId===ref)})[0]||PAYS.filter(function(h){return h.status==="pending"})[0];
}
/* Call when the admin decides: window.setPaymentStatus("approved") or ("rejected"). Optional 2nd argument: the payment id or transactionId (default: the latest processing payment). */
window.setPaymentStatus=function(st,ref){
  if(["approved","rejected","pending"].indexOf(st)<0)return;
  var it=findItem(ref);if(!it)return;
  if(it===lastItem){setStatus(st)}
  else{it.status=st;saveHist();renderHistory();if(st==="approved"&&typeof window.onPremiumActivated==="function")window.onPremiumActivated(it)}
};
function tick(){
  PAYS.filter(function(h){return h.status==="pending"}).forEach(function(it){
    Promise.resolve(window.checkPaymentStatus(it)).then(function(r){if(r==="approved"||r==="rejected")window.setPaymentStatus(r,it.id)}).catch(function(){});
  });
}
function startPoll(){if(poll||typeof window.checkPaymentStatus!=="function")return;poll=setInterval(tick,8000);tick()}
var backT=null;
function stopBack(){if(backT){clearInterval(backT);backT=null}}
/* While the payment is still processing, return to the Go premium page after 30 seconds. */
function startBack(){
  stopBack();var n=30;
  function tickBack(){
    if(status!=="pending"||$("s3").hidden){stopBack();return}
    $("stFine").textContent=F("Returning to Premium in {n}s",{n:n});
    if(n===0){stopBack();sel="";renderPlans();show("s1");return}
    n--;
  }
  tickBack();backT=setInterval(tickBack,1000);
}
window.setConfig=function(c){
  c=c||{};if(c.lang)LANG=c.lang;if(c.cur)CUR=c.cur;if(c.brand)BRAND=c.brand;

};

window.setMethods=function(list){METHODS=[];NUMBERS={};(list||[]).forEach(function(m){if(m&&m.id&&m.num){METHODS.push({id:m.id,name:m.name,type:m.type});NUMBERS[m.id]=String(m.num)}});if(!$("s2").hidden)renderCheckout()};
window.setPayInfo=function(t){INFO=String(t||"")};
window.setPremiumStatus=function(a){var e=$("myStat");e.innerHTML="";(Array.isArray(a)?a:[]).filter(Boolean).forEach(function(x){var d=document.createElement("div");d.textContent=x;e.appendChild(d)});e.hidden=!e.firstChild};
/* Called when the user submits. Connect it to your app: define window.onPaymentSubmit(data) (may return a Promise), or it posts to React Native / Flutter / Android if present. */
function notifyApp(d){
  if(typeof window.onPaymentSubmit==="function")return Promise.resolve(window.onPaymentSubmit(d));
  if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(JSON.stringify({type:"payment_submitted",data:d}));
  else if(window.flutter_inappwebview)window.flutter_inappwebview.callHandler("paymentSubmitted",d);
  else if(window.Android&&window.Android.paymentSubmitted)window.Android.paymentSubmitted(JSON.stringify(d));
  return new Promise(function(r){setTimeout(r,900)});
}
$("subscribe").onclick=function(){
  $("oPlan").textContent=F("{name} plan · {sub}",{name:plan().name,sub:plan().sub});$("oPrice").textContent=M(plan().price);
  $("oDr").className=plan().dramas?"on":"off";
  $("oDrIc").innerHTML=plan().dramas?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 12h12"/></svg>';
  $("oDrTxt").textContent=T(plan().dramas?"All paid dramas and episodes included":"Paid dramas are bought separately");$("oTotal").textContent=M(plan().price);
  $("err").textContent="";renderCheckout();show("s2");
};
$("back").onclick=function(){show("s1")};
$("pay").onclick=function(){
  var e=validate();$("err").textContent=e;
  var bad=!/^01\d{9}$/.test(vals.phone)?"phone":(!/^[A-Z0-9]{6,20}$/.test(vals.trx)?"trx":"");
  document.querySelectorAll("#fields input").forEach(function(i){i.setAttribute("aria-invalid",String(i.getAttribute("data-k")===bad))});
  if(e)return;
  var b=$("pay"),d={plan:plan().name,planId:plan().id,days:plan().days,amount:plan().price.replace(/,/g,""),method:method().id,senderNumber:vals.phone,transactionId:vals.trx};
  b.disabled=true;b.textContent=T("Submitting…");

    $("dName").textContent=plan().name;$("dMethod").textContent=method().name;$("dTrx").textContent=vals.trx;$("dPaid").textContent=M(plan().price);
    vals.trx="";lastData=d;
    lastItem={id:(r&&r.id)||("p"+Date.now()),plan:plan().name,amount:plan().price,method:method().name,transactionId:d.transactionId,status:"pending",date:new Date().toISOString()};
    PAYS.unshift(lastItem);saveHist();renderHistory();
    setStatus("pending");show("s3");startPoll();startBack();
  },function(){$("err").textContent=T("Could not submit. Please try again.")}).then(function(){b.disabled=false;b.textContent=T("Submit payment")});
};
/* Leave the premium screen and return to the app's home page.
   Connect ONE of these to your app (the first one that exists is used). */
function exitPremium(){
  if(typeof window.onClosePremium==="function"){window.onClosePremium();return}
  if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage("close_premium");return}
  if(window.flutter_inappwebview){window.flutter_inappwebview.callHandler("closePremium");return}
  if(window.Android&&window.Android.closePremium){window.Android.closePremium();return}
  if(window.history.length>1){window.history.back()}
}
$("close").onclick=exitPremium;
$("finish").onclick=function(){
  stopBack();
  if(status==="rejected"){show("s2");return}
  sel="";renderPlans();show("s1");exitPremium();
};
renderPlans();renderHistory();startPoll();

function idFor(email){
  let h=2166136261; const s=email.trim().toLowerCase();
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }

}

function poster(d,extra=''){

}
function saveBtn(d){
  const on=S.list.includes(d.id);
  return `<button class="save" data-act="save" data-id="${d.id}" aria-pressed="${on}" aria-label="${t('save')}">${I.bookmark}</button>`;
}
function card(d){
  return `<div class="card"><div class="cwrap"><button class="card" data-act="open" data-id="${d.id}" style="width:100%" aria-label="${d.t}">${poster(d)}</button>${saveBtn(d)}</div>
    <button class="card" data-act="open" data-id="${d.id}"><div class="ct">${d.t}</div><div class="cv">${I.play}${fmt(d.v)}</div></button></div>`;
}
function filtered(){
  const q=S.q.trim().toLowerCase();
  let a=[...D].sort((x,y)=>y.v-x.v);
  if(q) return a.filter(d=>d.t.toLowerCase().includes(q)||d.g.toLowerCase().includes(q));
  switch(S.cat){
    case 'new': return a.filter(d=>d.n);
    case 'originals': return a.filter(d=>d.o);
    case 'romance': return a.filter(d=>d.g==='Romance');
    case 'thriller': return a.filter(d=>d.g==='Thriller'||d.g==='Mystery');
  }
  if(S.cat.startsWith('c:')) return a.filter(d=>d.g===esc(S.cat.slice(2)));
  return a;
}

/* Banner ads: the ad code comes from the admin panel and runs inside a small sandboxed frame. */
const adsOn=()=>!ADFREE&&CFG.adsEnabled!==false;
function adFrame(code){
  code=String(code||'').trim(); if(!code) return '';
  const probe='<script>(function(){var n=0,sent=0,t=setInterval(function(){var w=0,h=0;document.querySelectorAll("body *").forEach(function(e){if(e.tagName==="SCRIPT"||e.tagName==="STYLE")return;var r=e.getBoundingClientRect();if(r.width>=20&&r.height>=20&&r.width*r.height>w*h){w=r.width;h=r.height}});if(w&&h){parent.postMessage({vidzAd:1,w:Math.ceil(w),h:Math.ceil(h)},"*");sent++}if(++n>24||sent>3)clearInterval(t)},500)})();<\/script>';
  const doc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:0;overflow:hidden;background:transparent}body{display:flex;justify-content:center}</style>'+code+probe;
  return `<iframe class="adf" title="Advertisement" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox" scrolling="no" srcdoc="${esc(doc)}"></iframe>`;
}
/* An ad box stays hidden until the ad inside it reports that something real has loaded. */
window.addEventListener('message',e=>{
  const d=e.data; if(!d||d.vidzAd!==1) return;
  document.querySelectorAll('iframe.adf').forEach(f=>{
    if(f.contentWindow!==e.source) return;
    f.style.width=Math.min(d.w,360)+'px'; f.style.height=Math.min(Math.max(d.h,20),130)+'px';
    f.parentNode.classList.add('ok');

});
function syncHomeBanner(){

function loadEp(){
  const d=byId(P.id); P.pos=0;
  const url=(epInfo(d,P.ep)||{}).videoUrl, stage=$('#stage');
  stage.innerHTML='';
  if(url){
    const v=document.createElement('video'); v.src=url; v.playsInline=true; v.autoplay=true; v.setAttribute('playsinline','');
    v.addEventListener('timeupdate',()=>{P.pos=v.currentTime;P.dur=v.duration||P.dur;paint()});
    v.addEventListener('ended',nextEp); v.playbackRate=P.speed; stage.appendChild(v); P.video=v;
  } else {
    P.video=null; P.dur=75;
    stage.innerHTML=`<div class="ghost-ep">${t('ep')} ${String(P.ep).padStart(2,'0')}</div><div class="ph">${t('placeholder')}</div>`;
  }
  $('#pTitle').textContent=`${t('ep')}${P.ep}`;
  { const st=(epInfo(d,P.ep)||{}).story||''; const el=$('#pStory'); el.textContent=`${t('ep')}${P.ep}`+(st?' | '+st:''); }
  $('#pEp').textContent=`${t('ep')}${P.ep} / ${t('ep')}${epCount(d)}`;
  if(S.saveHist){ S.hist=[{id:P.id,ep:P.ep},...S.hist.filter(h=>h.id!==P.id)]; store.set('hist',S.hist); }
  setPlaying(true); paint();
}
function paint(){
  const f=Math.min(1,P.pos/(P.dur||1));
  const u=$('#barFill'); if(u) u.style.width=(f*100)+'%';
  const m=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  const tm=$('#pTime'); if(tm) tm.textContent=m(P.pos)+' / '+m(P.dur);
}
/* The texts and buttons fade out 15 seconds into playback and come back on tap or pause. */
const UI_HIDE_MS=15000;
function showUI(){
  const pl=$('#player'); if(!pl) return;
  pl.classList.remove('ui-off'); clearTimeout(P.uiT);
  if(P.playing) P.uiT=setTimeout(()=>{ if(P.playing){ pl.classList.add('ui-off'); playerAds() } },UI_HIDE_MS);
}
function setPlaying(on){
  P.playing=on; showUI(); const st=$('#stage'); if(st) st.classList.toggle('paused',!on);
  if(P.video){ on?P.video.play().catch(()=>{}):P.video.pause(); }
  clearInterval(P.timer);
  if(on && !P.video){ P.timer=setInterval(()=>{ P.pos+=0.2*P.speed; if(P.pos>=P.dur) nextEp(); paint(); },200); }
}
function flash(){ const f=$('#flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),450) }
function gotoEp(n){
  const d=byId(P.id); if(!d||n<1||n>epCount(d)||!epInfo(d,n)) return;
  if(isLocked(d,n)){ setPlaying(false); unlockPage(d.id,n,'player'); return }
  P.ep=n; loadEp();
}
function nextEp(){ const d=byId(P.id); if(P.ep<epCount(d)) gotoEp(P.ep+1); else setPlaying(false) }
function bindPlayer(){
  const stage=$('#stage'); let y0=null,x0=null;
  $('#player').onpointerdown=()=>showUI();
  stage.onclick=()=>{ setPlaying(!P.playing); flash() };
  stage.ontouchstart=e=>{ y0=e.touches[0].clientY; x0=e.touches[0].clientX };
  stage.ontouchend=e=>{ if(y0===null) return; const dy=e.changedTouches[0].clientY-y0, dx=Math.abs(e.changedTouches[0].clientX-x0); y0=null;
    if(Math.abs(dy)>70 && dx<60){ e.preventDefault(); dy<0?nextEp():gotoEp(P.ep-1) } };
  const bar=$('#bar');
  const seek=e=>{ const r=bar.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX); const f=Math.max(0,Math.min(1,(x-r.left)/r.width));
    P.pos=f*P.dur; if(P.video) P.video.currentTime=P.pos; paint() };
  bar.onpointerdown=e=>{ seek(e); bar.setPointerCapture(e.pointerId); bar.onpointermove=seek };
  bar.onpointerup=()=>{ bar.onpointermove=null };
}
function closePlayer(){
  clearInterval(P.timer); clearTimeout(P.uiT); $('#player').classList.remove('ui-off'); if(P.video) P.video.pause();

const hueOf=s=>{ let h=0; for(const c of String(s||'')) h=(h*31+c.charCodeAt(0))%360; return h };
const safeUrl=u=>/^https?:\/\/[^\s"'<>()]+$/i.test(String(u||'')) ? String(u) : '';
function txtHtml(s){ return esc(s).replace(/\n/g,'<br>') }
function rel(ms){
  const m=Math.max(0,Math.round((Date.now()-ms)/6e4));
  const bn=n=>String(n).replace(/\d/g,c=>'০১২৩৪৫৬৭৮৯'[c]);
  if(m<1) return ['Just now','এইমাত্র'];
  if(m<60) return [m+'m ago',bn(m)+' মিনিট আগে'];
  const h=Math.round(m/60); if(h<24) return [h+'h ago',bn(h)+' ঘণ্টা আগে'];
  const d=Math.round(h/24); return [d+'d ago',bn(d)+' দিন আগে'];
}
function fromDoc(id,x){

  return {id:String(id), t:esc(x.title||''), g:esc(x.genre||'Drama'), eps:+x.episodesCount||0, v:+x.views||0, h:[a,(a+40)%360],
    n:x.isNew?1:0, o:x.isOriginal?1:0, s:esc(x.synopsis||''), img:safeUrl(x.posterUrl),
    feat:x.featured?(+x.featuredOrder||999):0, top:+x.top10Rank||0,
    price:Math.max(0,+x.price||0),
    free:(x.freeEpisodes===null||x.freeEpisodes===undefined)?undefined:+x.freeEpisodes};
}
function mapNotifs(ns){

    id:String(n.id), d:n.dramaId?String(n.dramaId):'', ago:rel(n.sentAt||n.scheduledAt||n.createdAt||now),
    en:[esc(n.title),esc(n.body)], bn:[esc(n.title),esc(n.body)]

function cmpVer(a,b){
  const x=String(a||'0').split('.').map(n=>parseInt(n,10)||0), y=String(b||'0').split('.').map(n=>parseInt(n,10)||0);

/* Firebase connection. Used only when FIREBASE_CONFIG is filled in. */
async function makeBackend(){
  if(!FIREBASE_CONFIG) return null;
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  const imp=u=>Promise.race([import(u),new Promise((_,r)=>setTimeout(()=>r(new Error('Could not download '+u.split('/').pop()+' (slow or blocked network). Check your internet and tap Retry.')),25000))]);
  const [A,AU,FS]=await Promise.all([imp(B+'firebase-app.js'),imp(B+'firebase-auth.js'),imp(B+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG), auth=AU.getAuth(app), fs=FS.initializeFirestore(app,{experimentalAutoDetectLongPolling:true});
  const ms=v=>v&&typeof v.toMillis==='function'?v.toMillis():v;
  const norm=(id,d)=>{ const o={id}; for(const k in d) o[k]=ms(d[k]); return o };
  const col=async(p,...c)=>(await FS.getDocs(FS.query(FS.collection(fs,p),...c))).docs.map(s=>norm(s.id,s.data()));
  return {
    dramas:()=>col('dramas'),
    episodes:id=>col('dramas/'+id+'/episodes',FS.orderBy('number')),
    async config(){ const s=await FS.getDoc(FS.doc(fs,'config/app')); return s.exists()?s.data():null },
    categories:()=>col('categories',FS.orderBy('order')),
    notifs:()=>col('notifications',FS.orderBy('createdAt','desc'),FS.limit(30)),
    onUser:cb=>AU.onAuthStateChanged(auth,cb),
    async signAnon(){ if(!auth.currentUser) await AU.signInAnonymously(auth); return auth.currentUser },
    signOut:()=>AU.signOut(auth),
    async getUser(uid){ const s=await FS.getDoc(FS.doc(fs,'users/'+uid)); return s.exists()?s.data():null },
    async saveUser(uid,d,isNew){
      const data={email:d.email,name:d.name,vidzId:d.vidzId,lastLoginAt:FS.serverTimestamp()};
      if(isNew){ data.createdAt=FS.serverTimestamp(); data.blocked=false }
      await FS.setDoc(FS.doc(fs,'users/'+uid),data,{merge:true});
    },
    async touch(uid){ await FS.setDoc(FS.doc(fs,'users/'+uid),{lastSeenAt:FS.serverTimestamp()},{merge:true}) },
    async saveOrder(o){ const r=await FS.addDoc(FS.collection(fs,'orders'),{...o,status:'pending',createdAt:FS.serverTimestamp()}); return r.id },
    async orderStatus(id){ const s=await FS.getDoc(FS.doc(fs,'orders/'+id)); return s.exists()?(s.data().status||'pending'):'pending' },
    async feedback(f){ await FS.addDoc(FS.collection(fs,'feedback'),{...f,status:'open',createdAt:FS.serverTimestamp()}) }
  };
}

/* Shrink a photo to a small JPEG so it can be stored with the message. */
function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')) };
    im.onload=()=>{
      URL.revokeObjectURL(url);
      let w=im.naturalWidth, h=im.naturalHeight; const k=Math.min(1,900/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h);
      let q=.7, out=c.toDataURL('image/jpeg',q);
      while(out.length>600000&&q>.3){ q-=.1; out=c.toDataURL('image/jpeg',q) }
      out.length>700000?rej(new Error('big')):res(out);
    };
    im.src=url;
  });
}

function buyDramaPage(d){
  const f=d.free ?? CFG.freeEpisodes;
  PAYSEL={type:'drama',dramaId:d.id,title:String(d.t).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'),amount:d.price};
  payPage(`<div class="empty" style="margin-bottom:14px"><div class="lockic">${I.lock}</div><b>${t('buyDramaT')}</b>${t('buyDramaS').replace('{t}',d.t).replace('{f}',f)}</div>`);
}
const PM=[['bkash','bKash'],['nagad','Nagad']];
const payMethods=()=>PM.map(([k,n])=>({k,n,num:String(CFG[k+'Number']||'').replace(/\D/g,''),type:['agent','merchant'].includes(CFG[k+'Type'])?CFG[k+'Type']:'personal'})).filter(x=>x.num.length>=10);
function payPage(head){
  const o=PAYSEL; if(!o) return;
  const info=String(CFG.payInfo||'').trim(), ms=payMethods(), ready=(+o.amount>0)&&(ms.length>0||!!info);
  let body=head||`<div class="paysum"><b>${esc(o.title)}</b><em>${+o.amount>0?money(o.amount):t('soonTag')}</em></div>`;
  body+=`<p class="paystep">${t('payStep1').replace('{a}',+o.amount>0?`<span style="color:var(--accent)">${money(o.amount)}</span>`:'')}</p>`;
  if(ms.length) body+=ms.map(m=>`<div class="paym"><div class="pmh"><b>${m.n}</b><span class="ptag">${t('ty_'+m.type)}</span></div>
      <div class="paybox">${m.num}</div>
      <button class="btn ghost" style="width:100%" data-act="copyPay" data-n="${m.num}">${t('copyNum')}</button>
      <p class="note" style="margin:8px 0 0">${t('how_'+m.type).replace('{m}',m.n)}</p></div>`).join('');
  if(info) body+=`<div class="paybox" style="margin-top:12px">${esc(info)}</div>`;
  if(!ms.length&&!info) body+=`<div class="paybox">—</div>`;
  body+=`<p class="paystep">${t('payStep2')}</p>
    <input class="field" id="trx" type="text" placeholder="${t('trxPh')}" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40">`;
  if(!S.email) body+=`<p class="note" style="margin:0 0 10px">${t('loginFirst')}</p><button class="btn" style="width:100%" data-act="login">${t('login')}</button>`;
  else if(!ready) body+=`<button class="btn off" style="width:100%" disabled>${t('sendReq')}</button><p class="note">${t('payNotReady')}</p>`;
  else body+=`<button class="btn" style="width:100%" data-act="sendOrder">${t('sendReq')}</button><p class="note">${t('payNote')}</p>`;
  openPage(o.type==='plan'?t('premium'):t('payT'),body,'closeSettings');
}
async function sendOrder(btn){
  const o=PAYSEL; if(!o||!S.email||!(+o.amount>0)) return;
  const trx=($('#trx').value||'').trim().replace(/\s+/g,'');
  if(trx.length<4){ toast(t('trxBad')); return }
  const rec={email:S.email,type:o.type,title:String(o.title).slice(0,120),amount:+o.amount,trxId:trx.slice(0,40)};
  if(o.type==='plan') rec.days=o.days; else rec.dramaId=String(o.dramaId);
  btn.disabled=true;
  try{ if(BE) await BE.saveOrder(rec) }
  catch(e){ btn.disabled=false; toast(t('sendFail')); return }
  btn.disabled=false; PAYSEL=null;
  openPage(t('sentOk'),`<div class="empty"><div class="lockic">${I.clock}</div><b>${t('sentOk')}</b>${t('sentSub')}</div>
    <button class="btn" style="width:100%;margin-top:14px" data-act="refreshAcct">${t('refresh')}</button>`,'closeSettings');
}

/* ============ EVENTS ============ */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'scrim': if(e.target===el) closeSheet(); break;
    case 'tab': setTab(el.dataset.v); break;
    case 'cat': S.cat=el.dataset.c; S.q=''; renderHome(); break;
    case 'open': openDetail(id); break;
    case 'closeDetail': $('#detail').hidden=true; curDrama=null; renderAll(); break;
    case 'play': openPlayer(id,+el.dataset.ep||1); break;
    case 'closePlayer': closePlayer(); break;
    case 'save': {
      const i=S.list.indexOf(id); if(i>=0) S.list.splice(i,1); else S.list.unshift(id);
      store.set('list',S.list); toast(i>=0?t('removed'):t('added'));
      document.querySelectorAll(`[data-act="save"][data-id="${id}"]`).forEach(b=>b.setAttribute('aria-pressed',String(i<0)));
      if(!$('#detail').hidden && curDrama===id) renderDetail(id);
      if(S.tab==='list') renderList();
      break; }
    case 'ltab': S.listTab=el.dataset.v; renderList(); break;
    case 'lang': S.lang=el.dataset.v; store.set('lang',S.lang); renderAll(); break;
    case 'theme': S.theme=el.dataset.v; store.set('theme2',S.theme); applyTheme(); renderMe(); break;
    case 'share': {
      const url=location.href;
      try{ navigator.clipboard.writeText(url).then(()=>toast(t('copied')),()=>toast(url)); }catch(err){ toast(url) } break; }
    case 'speed': { const i=(SPEEDS.indexOf(P.speed)+1)%SPEEDS.length; P.speed=SPEEDS[i]; if(P.video) P.video.playbackRate=P.speed; $('#pSpeedT').textContent=P.speed+'x'; break; }
    case 'epsheet': {
      const d=byId(P.id); openSheet(`<h3><span>${d.t}</span><button data-act="scrim" style="font-size:22px;line-height:1" aria-label="${t('close')}">×</button></h3><div id="sEps"></div>`);
      epGrid($('#sEps'),d,P.ep,'goto'); break; }
    case 'history': histPage(); break;
    case 'notif': notifPage(); break;
    case 's_notifset': notifSetPage(); break;
    case 'togNotif': S.notifOn=!S.notifOn; store.set('notifOn',S.notifOn); notifSetPage(); updateBell(); renderMe(); break;
    case 'notifOn': S.notifOn=true; store.set('notifOn',true); notifPage(); updateBell(); renderMe(); break;
    case 'readAll': S.nread=NOTIFS.map(n=>n.id); store.set('nread',S.nread); notifPage(); updateBell(); renderMe(); break;
    case 'notifOpen': {
      if(Date.now()-lastSwipe<350) break;
      if(!S.nread.includes(id)){ S.nread.push(id); store.set('nread',S.nread); }
      updateBell(); renderMe();
      { const nd=NOTIFS.find(n=>n.id===id); if(nd&&nd.d&&byId(nd.d)){ $('#spage').hidden=true; openDetail(nd.d) } else notifPage(); }
      break; }
    case 'closeSettings': $('#spage').hidden=true; break;
    case 'settings': settingsSheet(); break;
    case 's_chk':
      subSheet(t('chkUpd'),`<p id="updMsg" style="margin:0">${t('checking')}</p><p class="note">${t('ver')} ${VER}</p>`);
      checkUpdate(); break;
    case 's_about': subSheet(t('about'),`<p style="margin:0 0 10px">${CFG.aboutText?txtHtml(CFG.aboutText):t('aboutTxt')}</p><p class="note">Vidz ${t('ver')} ${VER}<br>Powered by Shihab</p>`); break;
    case 's_privacy': subSheet(t('privacy'),`<p style="margin:0">${CFG.privacyText?txtHtml(CFG.privacyText):t('privTxt')}</p>`); break;
    case 's_terms': subSheet(t('terms'),`<p style="margin:0">${CFG.termsText?txtHtml(CFG.termsText):t('termsTxt')}</p>`); break;
    case 's_privset': privSheet(); break;
    case 's_feedback': feedbackPage(); break;
    case 'fbPick': $('#fbf').click(); break;
    case 'fbRm': FB.img=''; fbPaint(); break;
    case 'fbType': FB.type=el.dataset.v; fbPaint(); break;
    case 'togHist': S.saveHist=!S.saveHist; store.set('saveHist',S.saveHist); privSheet(); break;
    case 'wipe':
      S.list=[]; S.hist=[]; S.unl={}; store.set('unl',{}); S.email=''; S.user=''; S.uid=S.guest;
      if(BE&&S.fbUid) BE.signOut();
      ['list','hist','email','user'].forEach(k=>store.set(k,k==='email'||k==='user'?'':[]));
      $('#spage').hidden=true; renderAll(); toast(t('wiped')); break;
    case 'clearHist':
      S.hist=[]; store.set('hist',S.hist); closeSheet(); toast(t('histCleared'));
      if(!$('#spage').hidden) histPage();
      if(S.tab==='list') renderList();
      if(curDrama && !$('#detail').hidden) renderDetail(curDrama);
      break;
    case 'openFromSheet': closeSheet(); $('#spage').hidden=true; openDetail(id); break;
    case 'login':
      openPage(t('login'),`<p class="note" style="margin:0 0 12px">${t('loginNote')}</p>
        <input class="field" id="uname" type="email" inputmode="email" placeholder="example@gmail.com" autocomplete="email" autocapitalize="off" spellcheck="false">
        <p class="note" id="lerr" style="color:#e5484d;margin:-6px 0 10px" hidden>${t('gmailBad')}</p>
        <button class="btn" style="width:100%" data-act="doLogin">${t('cont2')}</button>`,'closeSettings');
      setTimeout(()=>{const f=$('#uname'); f&&f.focus()},50); break;
    case 'doLogin': {
      const v=($('#uname').value||'').trim().toLowerCase();
      if(!goodEmail(v)){ $('#lerr').hidden=false; break; }
      $('#lerr').hidden=true;
      if(BE){
        const btn=el; btn.disabled=true;
        LOGGING=true;
        try{
          await BE.signAnon();
          const ok=await finishLogin(v,true);
          if(ok){ loginOpen=false; closeSheet(); $('#spage').hidden=true; toast(t('welcome')+', '+S.user) }
        }catch(e){ $('#lerr').textContent=t('loginFail'); $('#lerr').hidden=false }
        LOGGING=false; btn.disabled=false; break;
      }
      S.email=v; S.user=v.split('@')[0].replace(/[._]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).slice(0,24);
      S.uid=idFor(v); store.set('email',S.email); store.set('user',S.user);
      closeSheet(); $('#spage').hidden=true; renderMe(); toast(t('welcome')+', '+S.user); break; }
    case 'plans': openPremium(); break;
    case 'sendOrder': sendOrder(el); break;
    case 'refreshAcct': await refreshAccount(true); break;
    case 'copyPay': { const txt=String(el.dataset.n||CFG.payInfo||'').trim(); try{ await navigator.clipboard.writeText(txt); toast(t('copied')) }catch(e){ const r=document.createRange(); const b=el.previousElementSibling; if(b){ r.selectNodeContents(b); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); try{ document.execCommand('copy'); toast(t('copied')) }catch(e2){} } } break; }
    case 'retry': start(); break;
    case 'openUpdate': { const u=CFG.updateUrl; if(/^https?:\/\//i.test(u||'')) window.open(u,'_blank','noopener'); else toast(t('noUpdUrl')); break; }
    case 'annClose': annHide=true; renderHome(); break;
    case 'feedback': feedbackPage(); break;
    case 'fbSend': sendFb(); break;
    case 'logout':
      if(BE){ BE.signOut(); toast(t('loggedOut')); break; }
      S.email=''; S.user=''; S.uid=S.guest; store.set('email',''); store.set('user','');
      renderMe(); toast(t('loggedOut')); break;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#layer').innerHTML) closeSheet(); else if(!$('#spage').hidden) $('#spage').hidden=true; else if(!$('#player').hidden) closePlayer(); else if(!$('#detail').hidden){ $('#detail').hidden=true; curDrama=null } } });

document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.id==='uname'){ const b=document.querySelector('[data-act="doLogin"]'); b&&b.click(); } });
/* Swipe a read notification left or right to delete it. */
let sw=null, lastSwipe=0;
document.addEventListener('pointerdown',e=>{
  const r=e.target.closest('.nrow'); if(!r) return;
  sw={r,x:e.clientX,y:e.clientY,dx:0,drag:false,read:r.dataset.read==='1'};
});
document.addEventListener('pointermove',e=>{
  if(!sw) return;
  const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(!sw.drag){ if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.5) sw.drag=true; else return; }
  sw.dx=dx;
  if(sw.read){ sw.r.style.transform=`translateX(${dx}px)`; sw.r.style.opacity=String(Math.max(.25,1-Math.abs(dx)/260)); }
});
function endSwipe(){
  if(!sw) return; const s=sw; sw=null;
  if(!s.drag) return;
  lastSwipe=Date.now(); s.r.classList.add('anim');
  if(s.read && Math.abs(s.dx)>90){
    s.r.style.transform=`translateX(${s.dx>0?'110%':'-110%'})`; s.r.style.opacity='0';
    const id=s.r.dataset.id;
    setTimeout(()=>{ S.ndel.push(id); store.set('ndel',S.ndel); notifPage(); updateBell(); renderMe(); toast(t('notifDeleted')); },220);
  } else {
    s.r.style.transform=''; s.r.style.opacity='';
    setTimeout(()=>s.r.classList.remove('anim'),230);
  }
}
document.addEventListener('pointerup',endSwipe);
document.addEventListener('pointercancel',endSwipe);

applyTheme(); renderAll(); setTab('home'); start();
</script>
